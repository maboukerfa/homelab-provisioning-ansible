# Adopted from the install this host has been running since July 2026, not
# written from scratch. The shape is still upstream's
# (https://github.com/immich-app/immich/releases/latest/download/docker-compose.yml)
# `database` and `redis` are unchanged from it, so what this file actually
# alters is the server and the model runner. What is deliberately NOT upstream
# is written up in stacks/immich/README.md.

services:
  immich-server:
    # v3.2.2 is
    # sha256:79cc1623323d5894922686d8743b4780181428f98eecbfb58ce12c41ef02d1ea
    #
    # Upstream reads the tag from ${IMMICH_VERSION} in .env, which on this host
    # was `v3`. That tag moves: it pointed at v3.0.3 when it was pulled in July
    # and at v3.2.2 by September, so any `docker compose pull` in between was
    # two minor versions and a batch of schema migrations nobody asked for.
    # Immich migrates the database on start and does not migrate back.
    #
    # Upgrading is a line in this diff: read the release notes, bump both
    # immich tags together, deploy. Server and machine-learning must move as
    # one -- they share an API contract, not just a version number.
    image: ghcr.io/immich-app/immich-server:v3.2.2
    container_name: immich_server
    # appuser, the identity every container in this homelab runs as. Immich
    # installs as root by default and this host did for its first two months;
    # /srv/immich-images/images and /srv/immich/postgres were chowned to 2000
    # in the same commit that added these lines.
    #
    # Unusually cheap to set here: start.sh sets LD_PRELOAD, reads the optional
    # *_FILE secrets and execs node. Nothing in it chowns, binds a privileged
    # port or needs to start as root, so overriding the uid changes who writes
    # the bind mount and nothing else.
    user: "2000:2000"
    # `always`, like the rest of this file and unlike every other stack here.
    # Adoption fidelity: the point of this file is to change who deploys
    # Immich, not how it runs. Switch the four to `unless-stopped` in one
    # deliberate commit if you want the repo-wide convention.
    restart: always
    environment:
      # Immich's own defaults for all four, stated anyway: they are the
      # coupling to the service names below, and the thing you have to change
      # if a service is ever renamed.
      DB_HOSTNAME: database
      DB_USERNAME: postgres
      DB_DATABASE_NAME: immich
      REDIS_HOSTNAME: redis
      DB_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env}

      # Where the library lives *inside* the container, and the default. It is
      # spelled out because the absolute paths of every asset are rows in the
      # database: change this and Immich stops finding files it still lists.
      # `immich-admin media-location` is the supported way to move it.
      IMMICH_MEDIA_LOCATION: /data

      # Upstream hands this container the whole .env with `env_file:`, which is
      # how a stack ends up passing its database password to a model runner
      # that has no database. Dropped here -- everything Immich reads is above.
    volumes:
      # The library: originals, thumbs, transcodes, profile images and Immich's
      # own nightly database dumps. 34G, on its own LVM volume mounted at
      # /srv/immich-images -- playbooks/immich.yml refuses to deploy if that
      # mount is missing, because an unmounted path here is an empty library on
      # the root disk and Immich would happily start filling it.
      - /srv/immich-images/images:/data
      # Timestamps in logs and in the UI's "uploaded at". The container has no
      # TZ set, so without this it is UTC.
      - /etc/localtime:/etc/localtime:ro
    ports:
      # Every interface, not loopback. `tailscale serve` reaches it on
      # localhost and would be happy either way -- it is open because the
      # mobile apps upload straight to the LAN address, and that failing
      # silently while the tailnet name still worked would not be noticed for
      # a week.
      - '2283:2283'
    depends_on:
      - redis
      - database
    healthcheck:
      # `disable: false` keeps the image's own healthcheck (immich-healthcheck)
      # rather than replacing it. Upstream's line, kept.
      disable: false
    # Meaningful only now that the uid is pinned. While this ran as root it was
    # DAC_OVERRIDE that let it write a bind mount owned by somebody else, so
    # dropping capabilities would have been decoration. As 2000 it writes files
    # it owns, and 2283 is above the privileged range.
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

  immich-machine-learning:
    # Same release as the server, and not optional: the two speak a versioned
    # API and a mismatch shows up as search and face detection quietly failing.
    # v3.2.2 is
    # sha256:60dfcf266a9ef3b7376f5678e8c980d4fb61db5fc48c078fe8a326ab1535d60d
    #
    # For hardware acceleration the tag takes a suffix -- v3.2.2-cuda, -openvino,
    # -armnn, -rocm, -rknn -- plus the hwaccel.ml.yml overlay. This host has no
    # GPU, so it runs CPU inference.
    image: ghcr.io/immich-app/immich-machine-learning:v3.2.2
    container_name: immich_machine_learning
    # appuser. The only thing this writes is the model cache, and every path it
    # caches to -- MACHINE_LEARNING_CACHE_FOLDER, TRANSFORMERS_CACHE, HF_HOME --
    # is already under /cache in the image, so the volume below is the whole
    # surface. HOME is /root and stays unwritable; nothing has asked for it.
    user: "2000:2000"
    restart: always
    volumes:
      # A named volume, not a bind mount under /srv, and on purpose: these are
      # ~2GB of CLIP and face-recognition weights that re-download on demand.
      # /srv is for what cannot be recreated, and this can.
      - model-cache:/cache
    healthcheck:
      disable: false
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    # No environment block at all. Every MACHINE_LEARNING_* knob is defaulted,
    # and the only thing upstream's `env_file: .env` actually delivered here
    # was the database password.

  redis:
    # Upstream's digest for v3.2.2, not whatever `valkey:9` resolves to today --
    # this is valkey 9.1.1, the build Immich is tested against, and the tag has
    # already moved past it.
    #
    # Immich uses it for the job queue, and an empty queue after a restart means
    # pending thumbnail and ML jobs are re-derived from the database rather than
    # lost -- which is why this one gets no volume and no backup.
    #
    # The one service here with no `user:` line. Its entrypoint starts as root
    # and gosu's down to the image's own uid 999, so it is already unprivileged
    # where it counts, and it writes nothing outside the container -- which is
    # the only thing a pinned uid would be protecting. Forcing 2000 would skip
    # the gosu and leave valkey on a /data it does not own.
    container_name: immich_redis
    image: docker.io/valkey/valkey:9@sha256:70739f85ad2ee01a726a965584a0f94895f01b0c60b3cc8b0aeef11eaa6888cf
    healthcheck:
      # Not a bare `redis-cli ping`: redis-cli exits 0 on an error reply, so the
      # bare form reports healthy for any answer at all. Verified on this host --
      # `redis-cli notacommand` prints ERR and exits 0. Upstream tightened this
      # in v3.2.2 and it is worth carrying over.
      test: redis-cli ping | grep -q PONG || exit 1
    restart: always

  database:
    # Not interchangeable with the stock postgres image: it carries VectorChord
    # and pgvecto.rs, which is what smart search and face clustering query. The
    # major (14) and both extension versions are part of the on-disk format --
    # treat a change to any of them as a migration, and read Immich's release
    # notes, which tell you when one is required.
    container_name: immich_postgres
    image: ghcr.io/immich-app/postgres:14-vectorchord0.4.3-pgvectors0.2.0@sha256:bcf63357191b76a916ae5eb93464d65c07511da41e3bf7a8416db519b40b1c23
    # appuser, for the reasons written up in stacks/litellm/README.md: the
    # image's own uid is 999, which on this Debian host already belongs to
    # `caddy`, so `ls -l` on the data directory named the wrong owner.
    #
    # This image is Debian, not alpine, and the entrypoint only fabricates a
    # passwd entry with libnss_wrapper around initdb -- so "does postgres start
    # as an unknown uid" was worth rehearsing rather than assuming. It does: a
    # throwaway cluster initdb'd and reached "ready to accept connections" as
    # 2000:2000 before this line was written.
    user: "2000:2000"
    environment:
      # Upstream reads these three from .env. Only the password is a secret, so
      # only the password stays there; the other two are configuration and
      # belong in the file you can read without sudo. The values are what the
      # existing cluster was initialised with -- they are not free to change.
      POSTGRES_USER: postgres
      POSTGRES_DB: immich
      POSTGRES_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env}
      POSTGRES_INITDB_ARGS: '--data-checksums'
    volumes:
      # On the root filesystem, not the photo volume. A live PG data directory
      # is not a backup artifact -- what the restic job saves is the nightly
      # dump Immich writes into /data/backups.
      - /srv/immich/postgres:/var/lib/postgresql/data
    shm_size: 128mb
    restart: always
    healthcheck:
      disable: false
    # Safe now that the uid is pinned: the entrypoint never has to chown the
    # data directory or setuid away from root, and 5432 is unprivileged.
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

volumes:
  model-cache:
