services:
  silverbullet:
    # 2.10.0 is sha256:27b5724cc36798e7de82180ec9898ea9c157c4f15127f279834bca2897b91f37

    image: zefhemel/silverbullet:2.10.0
    container_name: silverbullet
    restart: unless-stopped
    # The image ships no non-root user and does no PUID/PGID juggling in its
    # entrypoint - it is a single static binary - so the uid is set here.
    # 2000:2000 is appuser, which also owns /srv/space, so the notes have
    # exactly one owner end to end.
    user: "2000:2000"
    environment:
      # Set explicitly rather than relying on the image default: the image's
      # own healthcheck curls "http://localhost:$SB_PORT/.instance", so an
      # unset SB_PORT silently turns the health status into a lie.
      SB_PORT: 3000
      # SB_HOSTNAME is deliberately absent: the image already sets it to 0.0.0.0
      # in its own ENV, so repeating it here only invites someone to "fix" it to
      # 127.0.0.1 and break the port mapping.
      SB_FOLDER: /space
      SB_USER: ${SB_USER:?set SB_USER in .env as user:password}
      # Bearer token for the HTTP API. Required rather than defaulted to empty,
      # for the same reason SB_USER is: an empty credential is ambiguous -- it
      # might disable token auth or it might accept an empty token, and guessing
      # wrong on a value that gates API access is not worth the convenience.
      SB_AUTH_TOKEN: ${SB_AUTH_TOKEN:?set SB_AUTH_TOKEN in .env}
    ports:
      # Published on 8002 to leave 3000 free; the container still listens on
      # 3000 internally, which is what SB_PORT above has to agree with.
      - '8002:3000'
    volumes:
      - /srv/space:/space
    # Nothing here needs elevated privileges: the space is a plain bind mount
    # and 3000 is above the privileged range, so it binds fine without them.
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
