---
# The account Ansible logs in as and escalates from. This is your admin login --
# NOT the appuser the bootstrap creates. appuser is a service identity with a
# locked password and no shell; it never runs Ansible.
ansible_user: maboukerfa

# ---------------------------------------------------------------------------
# Filesystem convention
# ---------------------------------------------------------------------------
# A stack named `foo` occupies two paths on the host:
#
#   /opt/foo/compose.yaml   what to run -- root-owned, deployed from this repo
#   /srv/foo/               what it keeps -- appuser-owned, bind-mounted in
#
# The reason to keep them apart: it makes the backup boundary a directory rather
# than a judgement call you re-make for every new service. /srv is the only
# precious half; /opt is reproducible from this repo and needs nothing.
homelab_stack_root: /opt
homelab_data_root: /srv

# ---------------------------------------------------------------------------
# Archive remotes
# ---------------------------------------------------------------------------
# Where playbooks/silverbullet-git.yml pushes /srv/space. A **private** repo:
# the space is your notes, and the archive is a verbatim copy of them.
#
# SSH, not HTTPS, because the credential is then a deploy key scoped to this one
# repo. A token would give the homelab write access to every repo on the
# account. The key itself is placed on the host by hand and never enters this
# repo -- see stacks/silverbullet/README.md.
silverbullet_git_remote: git@github.com:maboukerfa/SilverBullet_space.git

# Role knobs live in roles/<name>/defaults/main.yml and are documented there.
# Override them here (or in group_vars/homelab.yml) rather than editing defaults,
# so a role stays a drop-in and your choices stay in one greppable place.
