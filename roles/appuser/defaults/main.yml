---
appuser_name: appuser
appuser_group: appuser

# Pinned, not auto-allocated, and this is the single most important line in the
# role. Bind mounts carry numeric ids, not names -- the kernel never sees the
# word "appuser". If the host is ever rebuilt and useradd hands out 1001 instead,
# every file under /srv is suddenly owned by a stranger and every container that
# writes to a volume starts failing in ways that look like application bugs.
#
# 2000 deliberately clears uid 1000 (maboukerfa), which the running silverbullet
# and immich stacks are already pinned to. Nothing in this role touches their
# files; see roles/appuser/tasks/main.yml for what "nothing" means precisely.
appuser_uid: 2000
appuser_gid: 2000

# No interactive shell. appuser is an ownership identity, not an account anyone
# signs into: containers run as 2000:2000, which is a uid the kernel checks and
# needs no shell at all, and systemd runs ExecStart directly without one either.
#
# What this changes in practice, because it will bite you once:
#   sudo -u appuser <cmd>   works -- sudo execs the command, not a login shell
#   sudo -u appuser -i      FAILS -- -i means "login shell", and there is none
#   su - appuser            FAILS, same reason
# Use the first form. /usr/sbin/nologin is the Debian path and it logs the
# attempt; /bin/false is equally locked but tells you nothing afterwards.
appuser_shell: /usr/sbin/nologin

# Kept even though nobody logs in. Anything running as appuser still resolves
# $HOME: the docker CLI writes ~/.docker/config.json, restic caches under
# ~/.cache. Without a real home those land somewhere unwritable and surface as
# permission errors that read like application bugs.
appuser_home: "/home/{{ appuser_name }}"
appuser_home_mode: "0750"

# Membership of `docker` is root-equivalent: anyone who can act as appuser can
# start a container that bind-mounts / and step straight out as root.
#
# nologin shrinks the set of things that can act as appuser to almost nothing --
# there is no shell to log into, so this only matters for a systemd unit
# declaring User=appuser that shells out to `docker compose`. If Ansible does
# all your deploying, it does that as root and nothing here needs the group:
# set this false and the root-equivalence disappears with it.
appuser_in_docker_group: true
appuser_extra_groups: []

# Belt and braces alongside nologin: there is no password to guess or spray, so
# changing the shell back later cannot quietly re-open a login path on its own.
appuser_password_locked: true
