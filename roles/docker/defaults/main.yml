---
# The five packages that make up "docker and docker compose" from Docker's own
# apt repo. docker-compose-plugin is the v2 `docker compose` subcommand; the v1
# `docker-compose` Python script is end-of-life upstream and deliberately absent.
docker_packages:
  - docker-ce
  - docker-ce-cli
  - containerd.io
  - docker-buildx-plugin
  - docker-compose-plugin

# Ubuntu derivatives (Mint, Pop!_OS, Raspberry Pi OS on some releases) report a
# distribution or codename Docker's repo does not carry. When that happens,
# override these two with the upstream values the derivative is built from.
docker_apt_repo_url: "https://download.docker.com/linux/{{ ansible_facts['distribution'] | lower }}"
docker_apt_release: "{{ ansible_facts['distribution_release'] }}"
docker_apt_channel: stable
docker_apt_keyring_path: /etc/apt/keyrings/docker.asc

docker_service_enabled: true
docker_service_state: started

# Docker's install guide opens by purging the distro's own docker packages,
# which is what this does. Safe on a fresh host -- they are not installed, so it
# is a no-op that stops docker.io from being pulled in later as someone else's
# dependency and shadowing the real docker on $PATH.
#
# Set this false before pointing the playbook at a machine that is already
# running containers from docker.io: there, the removal stops every one of them.
docker_remove_conflicting_packages: true
docker_conflicting_packages:
  - docker.io
  - docker-doc
  - docker-compose
  - docker-compose-v2
  - podman-docker
  - containerd
  - runc

# ---------------------------------------------------------------------------
# Daemon configuration
# ---------------------------------------------------------------------------
# On by default, and the right time to do it is now: applying this restarts
# dockerd, which is free on a host with nothing running yet and an outage later.
# live-restore in particular only protects container uptime once it is already
# active, so the restart that enables it is the one it cannot cover -- do it
# before there is anything to protect.
#
# json-file logging with no max-size is the classic way a homelab dies at 3am:
# one chatty container fills the disk and takes every other service with it.
#
# Set false before running against a host that is already serving traffic, and
# apply it there in a chosen window instead. Note also that log-opts apply to
# containers created *after* the change; existing ones keep their current
# settings until they are recreated.
docker_manage_daemon_config: true
docker_daemon_config:
  log-driver: json-file
  log-opts:
    max-size: "10m"
    max-file: "3"
  # Keeps running containers alive across future dockerd restarts and upgrades.
  # Incompatible with swarm mode, which this host does not use.
  live-restore: true

# Asserted after install, so a silent no-op cannot masquerade as success.
docker_min_version: "24.0.0"
docker_compose_min_version: "2.20.0"
