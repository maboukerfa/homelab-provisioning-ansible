[defaults]
inventory             = inventory/hosts.yml
roles_path            = roles
collections_path      = collections
interpreter_python    = auto_silent
host_key_checking     = True
# Readable multi-line task output and diffs. NOT `stdout_callback = yaml` --
# that resolved to community.general.yaml, which was removed in
# community.general 12.0 and now makes every ansible command exit with a plugin
# error. This is the supported replacement, in core since 2.13.
result_format         = yaml

# FQCN, not the short name: profile_tasks ships in ansible.posix, not core, and
# the short form silently does nothing until that collection is installed.
callbacks_enabled     = ansible.posix.profile_tasks
retry_files_enabled   = False
display_skipped_hosts = False
forks                 = 10

[privilege_escalation]
become        = False
become_method = sudo

[ssh_connection]
# Pipelining roughly halves the SSH round-trips per task. It needs `requiretty`
# off in sudoers, which is already the default on Debian and Ubuntu.
pipelining = True
ssh_args   = -o ControlMaster=auto -o ControlPersist=60s
